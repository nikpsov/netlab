baseURL = "https://nikpsov.github.io/netlab/"
languageCode = "ru"
title = "NetLab Notes & Guides"
theme = "hextra"

defaultContentLanguage = "ru"

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[languages.ru]
  languageName = "Русский"
  weight = 1

  [[languages.ru.menu.main]]
    name = "Гайды"
    pageRef = "/guides"
    weight = 1

  [[languages.ru.menu.main]]
    name = "Статьи"
    pageRef = "/articles"
    weight = 2

  [[languages.ru.menu.main]]
    name = "Поиск"
    weight = 50
    [languages.ru.menu.main.params]
      type = "search"

  [[languages.ru.menu.main]]
    name = "GitHub"
    url = "https://github.com/nikpsov/netlab"
    weight = 99
    [languages.ru.menu.main.params]
      icon = "github"

[params]
  description = "База знаний и гайды NetLab"
  navbar.displayTitle = true
  navbar.displayLogo = false
  theme.default = "system"
  theme.displayToggle = true
  search.enable = true
  search.type = "flexsearch"
  footer.enable = true
  footer.displayCopyright = false
  footer.displayPoweredBy = false
  editURL.enable = true
  editURL.base = "https://github.com/nikpsov/netlab/edit/main/content"
